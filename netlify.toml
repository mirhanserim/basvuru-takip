[build]
  command = "npm run build"
  publish = "dist"

# Vite dosya adlarında içerik özeti (hash) var: değişmeyen dosyaları tarayıcı bir yıl önbellekte tutar
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
